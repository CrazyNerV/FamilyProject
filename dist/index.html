<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Garden · 나의 영어 정원</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><header><a class="brand" href="#">✳ <span>word garden<small>나만의 영어 정원</small></span></a><nav><button class="active" data-page="dictionary">나의 사전</button><button data-page="quiz">퀴즈 테스트</button><button data-page="history">학습 기록</button></nav><span class="private">● 개인 학습 공간 · <a href="../migrate/" style="color:inherit">v2로 데이터 이관 ↗</a></span></header><main id="app"></main><div id="toast" role="status"></div>
<dialog id="editor"><form id="word-form"><div class="eyebrow">GROW YOUR VOCABULARY</div><h2 id="form-title">새로운 표현 심기</h2><label>종류<select id="kind"><option value="word">단어</option><option value="idiom">숙어</option></select></label><label>영어 단어 또는 숙어<input id="english" required maxlength="120" placeholder="예: make a difference" pattern=".*[A-Za-z].*"></label><div id="pronunciation-preview"></div><label>한글 뜻<input id="korean" required maxlength="200" placeholder="예: 변화를 가져오다; 차이를 만들다"></label><p class="muted">한글 발음은 자동 추정한 참고 표기이며, 실제 소리와 다를 수 있어요.</p><p class="muted">여러 정답은 세미콜론(;)으로 구분해 주세요.</p><div class="actions"><button type="button" class="secondary" id="cancel">취소</button><button class="primary">저장하기 ↗</button></div></form></dialog><script type="module" src="app.js?v=4"></script></body></html>
